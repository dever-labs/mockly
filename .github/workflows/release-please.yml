name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          path: token-script
          sparse-checkout: scripts/gh-app-token.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Log in to OpenBao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: https://vault.dever.dk
          method: jwt
          role: cd-release-mockly
          path: jwt
          exportToken: true
          secrets: |
            dever/data/shared/ci/github-release-app app_id | RELEASE_APP_ID

      - name: Generate app token
        id: app-token
        env:
          VAULT_ADDR: https://vault.dever.dk
          APP_ID: ${{ env.RELEASE_APP_ID }}
          OWNER: dever-labs
          REPOSITORIES: mockly
          TRANSIT_KEY: github-release-app
        run: python3 token-script/scripts/gh-app-token.py

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
