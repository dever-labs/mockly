name: Node client CI

on:
  push:
    branches: [main]
    paths:
      - 'clients/package.json'
      - 'clients/package-lock.json'
      - 'clients/node/**'
      - 'clients/node-cli/**'
      - 'clients/node-testcontainers/**'
  pull_request:
    paths:
      - 'clients/package.json'
      - 'clients/package-lock.json'
      - 'clients/node/**'
      - 'clients/node-cli/**'
      - 'clients/node-testcontainers/**'
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/package-lock.json

      # clients/node, clients/node-cli, and clients/node-testcontainers are an
      # npm workspace rooted at clients/ (see clients/package.json). This lets
      # intra-repo dependencies (e.g. clients/node-cli -> mockly-driver)
      # resolve via local workspace links instead of the npm registry, so
      # release-please's extra-files jsonpath entries can bump
      # clients/package-lock.json's version fields directly and keep it in
      # sync with version bumps before the bumped packages are actually
      # published. The OS/CPU-restricted mockly-driver-* platform
      # sub-packages are linked the same way via the root package.json's
      # `overrides` field rather than being workspace members themselves
      # (npm workspaces have no way to treat an os/cpu-restricted member as
      # optional — see npm/cli#6138 — so listing them as workspace members
      # would force every install to pass --force).
      - name: Install workspace dependencies
        run: npm ci
        working-directory: clients

      - name: Typecheck
        run: npm run typecheck
        working-directory: clients/node

      - name: Test
        run: npm test
        working-directory: clients/node

  ci-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/package-lock.json

      # See the `ci` job above for why the shared workspace root.
      - name: Install workspace dependencies
        run: npm ci
        working-directory: clients

      # clients/node-cli depends on @dever-labs/mockly-driver, which now
      # resolves via a workspace link to clients/node's source rather than a
      # published registry tarball — so its dist/ build output (imported by
      # clients/node's package.json "main"/"module" fields) must exist before
      # clients/node-cli's tests can import it.
      - name: Build mockly-driver (workspace dependency)
        run: npm run build
        working-directory: clients/node

      - name: Test
        run: npm test
        working-directory: clients/node-cli

  ci-testcontainers:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/package-lock.json

      # See the `ci` job above for why the shared workspace root.
      - name: Install workspace dependencies
        run: npm ci
        working-directory: clients

      - name: Typecheck
        run: npm run typecheck
        working-directory: clients/node-testcontainers

      - name: Test
        run: npm test
        working-directory: clients/node-testcontainers
