name: Kotlin client CI

on:
  push:
    branches: [main]
    paths:
      - 'clients/kotlin/**'
      - 'clients/java/pom.xml'
      - 'clients/java/src/main/java/**'
  pull_request:
    paths:
      - 'clients/kotlin/**'
      - 'clients/java/pom.xml'
      - 'clients/java/src/main/java/**'
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Install Java driver (mockly-kotlin dependency)
        run: mvn -B install -f clients/java/pom.xml -DskipTests -q

      - name: Build & Test
        run: mvn -B verify -f clients/kotlin/pom.xml
