name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          path: token-script
          sparse-checkout: scripts/gh-app-token.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Log in to OpenBao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: https://vault.dever.dk
          method: jwt
          role: cd-release-mockly
          path: jwt
          exportToken: true
          secrets: |
            dever/data/shared/ci/github-release-app app_id | RELEASE_APP_ID

      - name: Generate app token
        id: app-token
        env:
          VAULT_ADDR: https://vault.dever.dk
          APP_ID: ${{ env.RELEASE_APP_ID }}
          OWNER: dever-labs
          REPOSITORIES: mockly
          TRANSIT_KEY: github-release-app
        run: python3 token-script/scripts/gh-app-token.py

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json

      # When a release PR is created/updated, regenerate npm lock files on that branch
      # so that `npm ci` stays in sync with the version-bumped package.json files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        if: ${{ steps.release.outputs.pr }}
        with:
          node-version: "22"

      - name: Sync npm lock files to new version
        if: ${{ steps.release.outputs.pr }}
        run: |
          VERSION=$(node -p "require('./clients/node/package.json').version")

          # Update only the mockly-driver-* optional packages in the clients/node lock file.
          # Specifying packages explicitly prevents npm from drifting other dep versions.
          (cd clients/node && npm install --package-lock-only \
            "@dever-labs/mockly-driver-linux-x64@$VERSION" \
            "@dever-labs/mockly-driver-linux-arm64@$VERSION" \
            "@dever-labs/mockly-driver-darwin-x64@$VERSION" \
            "@dever-labs/mockly-driver-darwin-arm64@$VERSION" \
            "@dever-labs/mockly-driver-win32-x64@$VERSION")

          # node-testcontainers has no driver deps — only the root version metadata needs updating.
          (cd clients/node-testcontainers && \
            jq --arg v "$VERSION" '.version = $v | .packages[""].version = $v' package-lock.json \
            > package-lock.json.tmp && mv package-lock.json.tmp package-lock.json)

          # node-cli depends on @dever-labs/mockly-driver directly (not optional).
          (cd clients/node-cli && npm install --package-lock-only \
            "@dever-labs/mockly-driver@$VERSION")

      - name: Commit lock file updates
        if: ${{ steps.release.outputs.pr }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clients/node/package-lock.json clients/node-testcontainers/package-lock.json clients/node-cli/package-lock.json
          git diff --staged --quiet || git commit -m "chore: regenerate npm lock files for version bump"
          git push
