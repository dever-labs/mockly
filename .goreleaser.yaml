# goreleaser configuration — see https://goreleaser.com
#
# Builds cross-platform mockly binaries, generates checksums.txt, and builds
# the release Docker image, replacing the hand-rolled steps previously
# scattered across .github/workflows/ci.yml's build/release/docker jobs.
#
# release-please (not goreleaser) owns creating the git tag and the GitHub
# Release object + changelog; release.mode: keep-existing below means
# goreleaser preserves that existing release's body/notes and only attaches
# artifacts to it. Note: goreleaser always (re)sets the release *name* from
# release.name_template (default "{{ .Tag }}"), regardless of this mode —
# this is a no-op today because release-please's release titles are already
# just the bare tag, but if that naming convention ever changes, goreleaser
# would silently reset the title back to the tag on each run.
#
# The UI (assets/dist/) must already be built before goreleaser runs — CI
# downloads the ui-dist artifact produced by the "ui" job first, exactly as
# the previous hand-rolled build job did, so there is no `before.hooks` UI
# build step here.
version: 2

project_name: mockly

builds:
  - id: mockly
    main: ./cmd/mockly
    binary: mockly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # Matches the previous `go build -ldflags="-s -w"` exactly — no version
    # symbols are injected since cmd/mockly has no `main.version` var today.
    ldflags:
      - -s -w

archives:
  - id: mockly
    ids: [mockly]
    formats: [binary]
    name_template: "mockly-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  mode: keep-existing

dockers:
  - id: mockly
    use: buildx
    dockerfile: Dockerfile.release
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/dever-labs/mockly:{{ .Tag }}"
      - "ghcr.io/dever-labs/mockly:latest"
    build_flag_templates:
      - "--platform=linux/amd64"

# .deb/.rpm packages for apt/yum-based provisioning (fleets, CI base images).
# Published as release assets alongside the raw binaries/checksums above; no
# hosted apt/yum repo is set up (would need repo signing-key infra and a
# hosting location) — evaluated and deliberately deferred, tracked as a
# possible future follow-up if there's demand for `apt install mockly`.
#
# Homebrew tap packaging is tracked as a separate follow-up issue; not
# configured here.
nfpms:
  - id: mockly
    ids: [mockly]
    package_name: mockly
    file_name_template: "mockly-{{ .Os }}-{{ .Arch }}"
    vendor: dever-labs
    homepage: https://github.com/dever-labs/mockly
    maintainer: dever-labs <noreply@dever.dk>
    description: |-
      One binary. Twenty protocols. Every failure mode your real
      dependencies won't let you test.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/mockly/LICENSE
