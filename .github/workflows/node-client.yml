name: Node client CI

on:
  push:
    branches: [main]
    paths:
      - 'clients/package.json'
      - 'clients/package-lock.json'
      - 'clients/node/**'
      - 'clients/node-cli/**'
      - 'clients/node-testcontainers/**'
  pull_request:
    paths:
      - 'clients/package.json'
      - 'clients/package-lock.json'
      - 'clients/node/**'
      - 'clients/node-cli/**'
      - 'clients/node-testcontainers/**'
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/package-lock.json

      # clients/node, clients/node-cli, clients/node-testcontainers, and
      # clients/node's own platform sub-packages are an npm workspace rooted at
      # clients/ (see clients/package.json). This lets intra-repo dependencies
      # (e.g. clients/node-cli -> @dever-labs/mockly-driver) resolve via local
      # workspace links instead of the npm registry, so release-please's
      # extra-files jsonpath entries can bump clients/package-lock.json's
      # version fields directly and keep it in sync with version bumps
      # before the bumped packages are actually published.
      # --force is required because some platform sub-packages intentionally
      # target other OS/CPU combinations (os/cpu fields in package.json); npm
      # refuses workspace-local links across platforms by default even though
      # that's exactly the point of optionalDependencies here.
      - name: Install workspace dependencies
        run: npm ci --force
        working-directory: clients

      - name: Typecheck
        run: npm run typecheck
        working-directory: clients/node

      - name: Test
        run: npm test
        working-directory: clients/node

  ci-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/package-lock.json

      # See the `ci` job above for why --force and the shared workspace root.
      - name: Install workspace dependencies
        run: npm ci --force
        working-directory: clients

      - name: Test
        run: npm test
        working-directory: clients/node-cli

  ci-testcontainers:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/package-lock.json

      # See the `ci` job above for why --force and the shared workspace root.
      - name: Install workspace dependencies
        run: npm ci --force
        working-directory: clients

      - name: Typecheck
        run: npm run typecheck
        working-directory: clients/node-testcontainers

      - name: Test
        run: npm test
        working-directory: clients/node-testcontainers
