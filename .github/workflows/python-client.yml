name: Python client CI

on:
  push:
    branches: [main]
    paths:
      - 'clients/python/**'
      - 'clients/python-testcontainers/**'
  pull_request:
    paths:
      - 'clients/python/**'
      - 'clients/python-testcontainers/**'
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install package
        run: pip install -e .

      - name: Install dev dependencies
        run: pip install pytest

      - name: Test
        run: pytest

  ci-testcontainers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients/python-testcontainers

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install package
        run: pip install -e .

      - name: Install dev dependencies
        run: pip install pytest

      - name: Test
        run: pytest
