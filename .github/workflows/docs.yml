name: Docs

on:
  push:
    branches:
      - main
      # TODO: remove this branch trigger once the docs site has been
      # reviewed and this PR is merged — it exists only so an early,
      # live preview can be deployed and judged before merging.
      - docs/mkdocs-material-site
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions: {}

jobs:
  # ─── Build (runs on every PR as a strict-mode check; no deploy) ────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements-docs.txt

      - run: mkdocs build --strict

  # ─── Deploy (only on push to main or this preview branch) ──────────────────
  # Pushes the built site to the `gh-pages` branch, which GitHub Pages is
  # configured to serve from. We can't use actions/deploy-pages or
  # actions/upload-pages-artifact here: the org's Actions policy only allows
  # SHA-pinned actions from a fixed allow-list, and those two aren't on it.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements-docs.txt

      - run: mkdocs build --strict

      - name: Publish to gh-pages branch
        run: |
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy docs for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
