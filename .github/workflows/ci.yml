name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

# Deny all permissions by default; each job opts in to what it needs.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Unit + Integration tests ───────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

      - name: Run tests
        run: go test ./internal/... -race -coverprofile=coverage.txt -covermode=atomic

      - name: Check coverage threshold
        run: ./scripts/check-coverage.sh coverage.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 30

      - name: Check documented dependency versions
        run: ./scripts/check-doc-versions.sh

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Java tests
        run: mvn -B test -f clients/java/pom.xml

      - name: Install Java driver (mockly-kotlin dependency)
        run: mvn -B install -f clients/java/pom.xml -DskipTests -q

      - name: Run Kotlin client tests
        run: mvn -B test -f clients/kotlin/pom.xml

  # ─── UI build ───────────────────────────────────────────────────────────────
  ui:
    name: UI Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: npm ci
        working-directory: ui

      - name: Lint UI
        run: npm run lint
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      - name: Upload UI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: ui-dist
          path: assets/dist/
          retention-days: 1

  # ─── E2E tests (requires built binary) ──────────────────────────────────────
  e2e:
    name: E2E Tests
    needs: [test, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Download UI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v6
        with:
          name: ui-dist
          path: assets/dist/

      - name: Run E2E tests
        run: go test -tags e2e ./tests/e2e/... -v -timeout 120s

  # ─── Testcontainers integration tests ───────────────────────────────────────
  test-testcontainers:
    name: Testcontainers Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Build Mockly Docker image from source
        run: docker build -t ghcr.io/dever-labs/mockly:latest .

      # Go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Run Go testcontainers tests
        run: go test -tags integration ./... -timeout 120s
        working-directory: clients/go/testcontainers

      # Node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: "22"

      # clients/node-testcontainers is part of the clients/ npm workspace (see
      # clients/package.json) alongside the other Node packages, so install
      # from there (see node-client.yml for details on the workspace setup).
      - name: Install Node workspace dependencies
        run: npm ci
        working-directory: clients

      - name: Run Node testcontainers tests
        run: npm run test:integration
        working-directory: clients/node-testcontainers

      # Python
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Run Python testcontainers tests
        run: pip install -e ".[dev]" && python -m pytest -m integration tests/ -v
        working-directory: clients/python-testcontainers

      # Rust
      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Run Rust testcontainers tests
        run: cargo test -- --ignored --test-threads=1
        working-directory: clients/rust-testcontainers

      # Java
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run Java testcontainers tests
        run: |
          mvn -B install -f clients/java/pom.xml -DskipTests -q
          mvn -B test -f clients/java/testcontainers/pom.xml
        env:
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

      # .NET
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Run .NET testcontainers tests
        run: dotnet test clients/dotnet --filter "Category=Integration" -v minimal

  # ─── Cross-platform binaries, checksums & Docker image (goreleaser) ────────
  # goreleaser (.goreleaser.yaml) cross-compiles all 5 targets, generates
  # checksums.txt, and builds the release Docker image in one pass, replacing
  # the previous hand-rolled per-arch build matrix + checksum/upload script +
  # docker build/push steps. On non-release events it only validates the
  # pipeline (`--snapshot`, nothing published); on the `release` event
  # (fired by release-please creating the GitHub Release) it actually
  # publishes. release-please still owns the tag/release/changelog —
  # release.mode: keep-existing means goreleaser only attaches artifacts to
  # the release release-please already created.
  build:
    name: Build (goreleaser)
    needs: [test, ui, test-testcontainers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GORELEASER_VERSION: "2.18.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full tag history to diff releases

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Download UI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v6
        with:
          name: ui-dist
          path: assets/dist/

      - name: Install goreleaser
        run: |
          set -euo pipefail
          asset="goreleaser_Linux_x86_64.tar.gz"
          base="https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}"
          curl -sSfL "${base}/${asset}" -o "${asset}"
          curl -sSfL "${base}/checksums.txt" -o goreleaser_checksums.txt
          grep " ${asset}\$" goreleaser_checksums.txt | sha256sum -c -
          tar xzf "${asset}" goreleaser
          sudo install -m 0755 goreleaser /usr/local/bin/goreleaser
          goreleaser --version

      # Always runs in snapshot mode here, even on a `release` event: this
      # job only needs to produce binaries/checksums/a local (unpushed)
      # Docker image for the downstream publish jobs below, which never
      # needs write access to repo contents or GHCR. The real publish
      # (attaching assets to the release, pushing the Docker image) happens
      # in the separate `publish-release` job, which is the only job that
      # ever holds those write permissions, and only on real release events.
      - name: Run goreleaser (snapshot validation, nothing published)
        run: goreleaser release --snapshot --clean

      # goreleaser's `formats: [binary]` archive keeps the original build
      # path/filename (e.g. dist/mockly_linux_amd64_v1/mockly) and only
      # records the intended "mockly-linux-amd64"-style name in its
      # metadata — flatten to that naming so downstream publish jobs (which
      # expect e.g. dist/mockly-linux-amd64) need no changes.
      - name: Flatten binaries for downstream artifact upload
        run: |
          set -euo pipefail
          mkdir -p dist-flat
          jq -r '.[] | select(.type=="Binary" and (.name | startswith("mockly-"))) | "\(.name)\t\(.path)"' dist/artifacts.json \
            | while IFS=$'\t' read -r name path; do
                cp "$path" "dist-flat/$name"
              done
          ls -la dist-flat/

      - name: Upload mockly-linux-amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: mockly-linux-amd64
          path: dist-flat/mockly-linux-amd64

      - name: Upload mockly-linux-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: mockly-linux-arm64
          path: dist-flat/mockly-linux-arm64

      - name: Upload mockly-darwin-amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: mockly-darwin-amd64
          path: dist-flat/mockly-darwin-amd64

      - name: Upload mockly-darwin-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: mockly-darwin-arm64
          path: dist-flat/mockly-darwin-arm64

      - name: Upload mockly-windows-amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: mockly-windows-amd64
          path: dist-flat/mockly-windows-amd64.exe

  # ─── Publish release assets + Docker image (release events only) ──────────
  # Deliberately a separate job from `build` so that `contents: write` /
  # `packages: write` are only ever granted on a real `release` event, never
  # ambiently available during ordinary push/PR runs.
  publish-release:
    name: Publish release assets
    needs: [build, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach release assets
      packages: write # push the Docker image to ghcr.io
    env:
      GORELEASER_VERSION: "2.18.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full tag history to diff releases

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false

      - name: Download UI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v6
        with:
          name: ui-dist
          path: assets/dist/

      - name: Install goreleaser
        run: |
          set -euo pipefail
          asset="goreleaser_Linux_x86_64.tar.gz"
          base="https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}"
          curl -sSfL "${base}/${asset}" -o "${asset}"
          curl -sSfL "${base}/checksums.txt" -o goreleaser_checksums.txt
          grep " ${asset}\$" goreleaser_checksums.txt | sha256sum -c -
          tar xzf "${asset}" goreleaser
          sudo install -m 0755 goreleaser /usr/local/bin/goreleaser
          goreleaser --version

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run goreleaser (publish release assets + Docker image)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-level secret (visibility: ALL) also used by dever-labs/postly to
          # push updated Homebrew formulas/casks to dever-labs/homebrew-tap.
          # Also used by goreleaser's `scoops:` pipe to push the Scoop
          # manifest to dever-labs/scoop-bucket.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: goreleaser release --clean

  # ─── Publish NuGet package ──────────────────────────────────────────────────
  nuget-publish:
    name: Publish NuGet
    needs: [build, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v6
        with:
          pattern: mockly-*
          merge-multiple: true
          path: dist/

      - name: Stage binaries into NuGet runtimes/ structure
        run: |
          RUNTIMES=clients/dotnet/src/Mockly.Driver/runtimes
          cp dist/mockly-linux-amd64    $RUNTIMES/linux-x64/native/mockly
          cp dist/mockly-linux-arm64    $RUNTIMES/linux-arm64/native/mockly
          cp dist/mockly-darwin-amd64   $RUNTIMES/osx-x64/native/mockly
          cp dist/mockly-darwin-arm64   $RUNTIMES/osx-arm64/native/mockly
          cp dist/mockly-windows-amd64.exe $RUNTIMES/win-x64/native/mockly.exe
          chmod +x $RUNTIMES/*/native/mockly

      - name: Pack
        run: |
          dotnet pack clients/dotnet/src/Mockly.Driver/Mockly.Driver.csproj \
            -c Release \
            -o dist/nuget
          dotnet pack clients/dotnet/src/Testcontainers.Mockly/Testcontainers.Mockly.csproj \
            -c Release \
            -o dist/nuget

      - name: Push to NuGet.org
        run: |
          dotnet nuget push dist/nuget/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # ─── Publish npm packages ────────────────────────────────────────────────────
  npm-publish:
    name: Publish npm
    needs: [build, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact@v6
        with:
          pattern: mockly-*
          merge-multiple: true
          path: dist/

      - name: Stage binaries into platform sub-packages
        run: |
          PKG=clients/node/packages
          cp dist/mockly-linux-amd64       $PKG/mockly-driver-linux-x64/bin/mockly
          cp dist/mockly-linux-arm64       $PKG/mockly-driver-linux-arm64/bin/mockly
          cp dist/mockly-darwin-amd64      $PKG/mockly-driver-darwin-x64/bin/mockly
          cp dist/mockly-darwin-arm64      $PKG/mockly-driver-darwin-arm64/bin/mockly
          cp dist/mockly-windows-amd64.exe $PKG/mockly-driver-win32-x64/bin/mockly.exe
          chmod +x $PKG/mockly-driver-linux-*/bin/mockly $PKG/mockly-driver-darwin-*/bin/mockly

      - name: Publish platform sub-packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in clients/node/packages/*/; do
            npm publish "$pkg" --access public --provenance
          done

      # clients/node, clients/node-cli, and clients/node-testcontainers are an
      # npm workspace rooted at clients/ (see clients/package.json and
      # node-client.yml). One shared install covers devDependencies for all
      # three build/publish steps below.
      - name: Install workspace dependencies
        run: npm ci
        working-directory: clients

      - name: Build and publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: clients/node
        run: |
          npm run build
          npm publish --access public --provenance

      - name: Build and publish testcontainers package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: clients/node-testcontainers
        run: |
          npm run build
          npm publish --access public --provenance

      - name: Publish CLI package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: clients/node-cli
        run: |
          npm publish --access public --provenance

  # ─── Publish PyPI package ────────────────────────────────────────────────────
  python-publish:
    name: Publish PyPI
    needs: [build, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Build wheel and sdist
        run: |
          pip install hatch
          cd clients/python && hatch build

      - name: Publish to PyPI
        run: |
          pip install twine
          twine upload --non-interactive clients/python/dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Build testcontainers wheel and sdist
        run: |
          cd clients/python-testcontainers && hatch build

      - name: Publish testcontainers to PyPI
        run: twine upload --non-interactive clients/python-testcontainers/dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ─── Publish Maven Central package ──────────────────────────────────────────
  java-publish:
    name: Publish Maven Central
    needs: [build, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Deploy to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B deploy -Prelease -f clients/java/pom.xml -DskipTests

      - name: Deploy testcontainers to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B deploy -Prelease -f clients/java/testcontainers/pom.xml -DskipTests

      - name: Deploy Kotlin client to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B deploy -Prelease -f clients/kotlin/pom.xml -DskipTests

  rust-publish:
    name: Publish crates.io
    needs: [build, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Publish driver to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path clients/rust/Cargo.toml --allow-dirty

      - name: Wait for crates.io to index driver
        run: sleep 30

      - name: Publish testcontainers to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path clients/rust-testcontainers/Cargo.toml --allow-dirty
