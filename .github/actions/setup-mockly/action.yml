name: Setup Mockly
description: Install and start the Mockly multi-protocol mock server for the duration of the job
author: dever-labs

branding:
  icon: server
  color: blue

inputs:
  version:
    description: Mockly release version to install (e.g. v0.1.0). Defaults to latest.
    required: false
    default: latest
  config:
    description: Path to the mockly.yaml config file
    required: false
    default: mockly.yaml
  start:
    description: Start mockly after installing
    required: false
    default: "true"
  api-port:
    description: Port for the management API (overrides config)
    required: false
    default: "9091"
  ready-timeout:
    description: Seconds to wait for the management API to report ready
    required: false
    default: "30"

outputs:
  api-url:
    description: Base URL of the Mockly management API
  version:
    description: Installed Mockly version
  log-file:
    description: >-
      Path to mockly's captured stdout/stderr log file. Upload it as an
      artifact in a step with `if: failure()` to debug a failed run, e.g.
      `uses: actions/upload-artifact@v4` with
      `path: ${{ steps.<this-step-id>.outputs.log-file }}`.

runs:
  using: node20
  main: main.js
  post: cleanup.js
  post-if: always()
