version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /clients/rust
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /clients/rust-testcontainers
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /clients/node
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # js-yaml v5 drops the default export used here (`import yaml from
    # 'js-yaml'`), breaking `yaml.dump()` at runtime.
    ignore:
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /clients/node-testcontainers
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /clients/python
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /clients/python-testcontainers
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: maven
    directory: /clients/java
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # JUnit Jupiter 6 requires Java 17+ at runtime; this client targets
    # Java 11 (maven.compiler.target) for broad consumer compatibility.
    ignore:
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /clients/java/testcontainers
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directory: /clients/dotnet
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
