name: Test setup-mockly action

on:
  pull_request:
    paths:
      - ".github/actions/setup-mockly/**"
      - ".github/workflows/test-setup-mockly-action.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/setup-mockly/**"
      - ".github/workflows/test-setup-mockly-action.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Write test config
        run: |
          cat > mockly.yaml <<'EOF'
          protocols:
            http:
              enabled: true
              port: 8099
          EOF

      - name: Start mockly
        id: mockly
        uses: ./.github/actions/setup-mockly
        with:
          config: mockly.yaml
          api-port: 9091

      # Regression test for the bug where the old composite action's "stop"
      # step ran inline immediately after start, killing mockly before any
      # later step in the job ever executed. If that bug reappears, this
      # step (which runs after the action's `uses:` call returns) would fail.
      - name: Mockly management API should be reachable
        run: curl -sf "${{ steps.mockly.outputs.api-url }}/api/protocols"

      - name: Upload mockly logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: mockly-logs
          path: ${{ steps.mockly.outputs.log-file }}
