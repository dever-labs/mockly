# Describes this repository in devhub (https://hub.dever.dk), dever-labs'
# developer portal. devhub's GitHub discovery reads this file from the
# default branch; docs come from mkdocs.yml (backstage.io/techdocs-ref).
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mockly
  namespace: mockly
  title: Mockly
  description: Multi-protocol mock server (20 protocols) with client libraries.
  annotations:
    devhub/visibility: public
    github.com/project-slug: dever-labs/mockly
  links:
    - url: https://mockly.dever.dk
      title: Mockly docs
spec:
  owner: group:mockly/engineering
  domain: domain:mockly/mockly
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mockly
  namespace: mockly
  title: Mockly
  description: Single Go binary (cmd/mockly) with the embedded React UI and management API.
  annotations:
    devhub/visibility: public
    github.com/project-slug: dever-labs/mockly
    devhub/install: docker:ghcr.io/dever-labs/mockly,scoop:dever-labs/mockly
    backstage.io/techdocs-ref: dir:.
  tags: [go]
spec:
  type: tool
  lifecycle: production
  owner: group:mockly/engineering
  system: system:mockly/mockly
  providesApis:
    - api:mockly/mockly-management-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mockly-management-api
  namespace: mockly
  title: Mockly Management API
  description: REST API for managing mocks, scenarios and faults (port 9091).
  annotations:
    devhub/visibility: public
    github.com/project-slug: dever-labs/mockly
spec:
  type: openapi
  lifecycle: production
  owner: group:mockly/engineering
  system: system:mockly/mockly
  definition:
    $text: ./docs/openapi.yaml
