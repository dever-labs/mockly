# Mockly preset: Keycloak
#
# Mocks the most commonly tested Keycloak endpoints. Realm, issuer, and
# client ID are parameterized via the "vars:" map below — edit the values
# there, or override at runtime with an OS env var of the same name
# (realm=..., issuer=..., client_id=...), to point this preset at your own
# realm/app without touching the mocks themselves.
#
# Start:   mockly preset use keycloak
#          mockly start --config configs/presets/keycloak.yaml
#
# Realm admin console would be at: http://localhost:8080/admin/myrealm/console
#
# NOTE: "id_token" is dynamically signed per-request with the jwt_sign
# template function (RS256, key id "mockly-key-1" — see the "jwks" mock
# below, which serves that same key's real public half via jwks_json so
# clients can verify the signature), so its "iss"/"aud" claims always line
# up with whatever vars (realm, issuer, client_id) this preset is started
# with, and it echoes back the "nonce" sent to /authorize — satisfying
# OIDC relying parties (e.g. Backstage's oidc provider) that validate the
# nonce claim on the /token response. "access_token" and "refresh_token"
# remain static opaque placeholder strings (unaffected by this).
#
# Ports:
#   HTTP mock server (Keycloak API) → :8080
#   Management API + UI             → :9091

vars:
  realm: myrealm
  issuer: http://localhost:8080
  client_id: my-app

mockly:
  ui:
    enabled: true
    port: 9091
  api:
    port: 9091

protocols:
  http:
    enabled: true
    port: 8080
    mocks:

      # ── OIDC Discovery ────────────────────────────────────────────────────
      - id: oidc-discovery
        request:
          method: GET
          path: /realms/${realm}/.well-known/openid-configuration
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            {
              "issuer": "${issuer}/realms/${realm}",
              "authorization_endpoint": "${issuer}/realms/${realm}/protocol/openid-connect/auth",
              "token_endpoint": "${issuer}/realms/${realm}/protocol/openid-connect/token",
              "introspection_endpoint": "${issuer}/realms/${realm}/protocol/openid-connect/token/introspect",
              "userinfo_endpoint": "${issuer}/realms/${realm}/protocol/openid-connect/userinfo",
              "end_session_endpoint": "${issuer}/realms/${realm}/protocol/openid-connect/logout",
              "jwks_uri": "${issuer}/realms/${realm}/protocol/openid-connect/certs",
              "grant_types_supported": ["authorization_code", "implicit", "refresh_token", "password", "client_credentials", "urn:ietf:params:oauth:grant-type:device_code"],
              "response_types_supported": ["code", "none", "id_token", "token", "token id_token", "code id_token", "code token", "code token id_token"],
              "subject_types_supported": ["public", "pairwise"],
              "id_token_signing_alg_values_supported": ["PS384", "ES384", "RS384", "HS256", "HS512", "ES256", "RS256", "HS384", "ES512", "PS256", "PS512", "RS512"],
              "scopes_supported": ["openid", "address", "email", "microprofile-jwt", "offline_access", "phone", "profile", "roles", "web-origins"],
              "token_endpoint_auth_methods_supported": ["private_key_jwt", "client_secret_basic", "client_secret_post", "tls_client_auth", "client_secret_jwt"],
              "claims_supported": ["aud", "sub", "iss", "auth_time", "name", "given_name", "family_name", "preferred_username", "email", "email_verified", "acr", "nonce", "locale", "updated_at"],
              "code_challenge_methods_supported": ["plain", "S256"],
              "tls_client_certificate_bound_access_tokens": true,
              "require_pushed_authorization_requests": false
            }

      # ── Authorization endpoint (browser authorization_code flow) ─────────
      # Mocks the redirect a real Keycloak would issue after a user logs in:
      # a 302 straight to the caller's redirect_uri with a mock ?code= and
      # the original ?state= echoed back, so an app's full browser-based
      # authorization_code flow (not just a backend password/client_credentials
      # grant) can be exercised end-to-end against this preset. There's no
      # login page and no redirect_uri allow-list check — whatever redirect_uri
      # is supplied is trusted and echoed back as-is.
      - id: authorize
        request:
          method: GET
          path: /realms/${realm}/protocol/openid-connect/auth
        response:
          status: 302
          headers:
            # Stashes the request's "nonce" (if any) keyed by the mock auth
            # code, so the /token response below can echo it back into the
            # signed id_token's "nonce" claim — letting clients that
            # validate nonce per the OIDC Core spec complete a full login.
            Location: '{{- state_set_ttl "keycloak:nonce:mock-auth-code-001" .query.nonce 300 -}}{{.query.redirect_uri}}?code=mock-auth-code-001{{if .query.state}}&state={{.query.state}}{{end}}'
          body: ""

      # ── JWKS (public keys) ────────────────────────────────────────────────
      # Served dynamically via jwks_json so it always matches whatever key
      # the "token-success" mock below actually signs id_tokens with.
      - id: jwks
        request:
          method: GET
          path: /realms/${realm}/protocol/openid-connect/certs
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: '{{ jwks_json "mockly-key-1" }}'

      # ── Token endpoint — success (password / client_credentials grant) ────
      - id: token-success
        request:
          method: POST
          path: /realms/${realm}/protocol/openid-connect/token
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            {
              "access_token": "eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJtb2NrbHkta2V5LTEifQ..pUwTZ6NHb95px1lNsm0604RJFMcZgOIQ9Hs4f66oaWegRjt0krr-yM4HG8Rb0KfevBlDxnxZ8pkonjZwNLuIW6RZx4-1ywoNv9k1zkwhkCK9uXxw3UFNtkS2WYnqUFQ8c7dR5MrV_MLqbwrI7px9eQouAhGZc2yVHRUwvqIr0aGg3KXkWtbkdvzC_YATvYFW6MXijRdQ7iWegBTH7xqVeZ56U1C_-LjJWt7NrtCz1jwlDKCDJL4gbey96JZCMi0A49UE9M2DbIuk6q9VTqK_AGQOctVeCjmezxCL222YnoB_2r_t8-4YCipo_jIg97v4X0V1FCns8rDn2ddSxROkLg",
              "expires_in": 300,
              "refresh_expires_in": 1800,
              "refresh_token": "eyJhbGciOiJIUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJtb2NrbHktcmVmcmVzaC1rZXkifQ.eyJzdWIiOiJ1c2VyLTEyMzQ1NiIsInNpZCI6Im1vY2stc2Vzc2lvbi0wMDEiLCJ0eXAiOiJSZWZyZXNoIn0.mock-refresh-signature",
              "id_token": "{{ jwt_sign (dict "iss" "${issuer}/realms/${realm}" "aud" "${client_id}" "azp" "${client_id}" "sub" "user-123456" "preferred_username" "alice" "nonce" (state "keycloak:nonce:mock-auth-code-001")) "mockly-key-1" }}",
              "token_type": "Bearer",
              "not-before-policy": 0,
              "session_state": "mock-session-001",
              "scope": "openid email profile"
            }

      # ── Token endpoint — invalid credentials ────────────────────────────
      - id: token-invalid-credentials
        request:
          method: POST
          path: /realms/${realm}/protocol/openid-connect/token
          body: "invalid_grant"
        response:
          status: 401
          headers:
            Content-Type: application/json
          body: |
            {
              "error": "invalid_grant",
              "error_description": "Invalid user credentials"
            }

      # ── UserInfo ─────────────────────────────────────────────────────────
      - id: userinfo
        request:
          method: GET
          path: /realms/${realm}/protocol/openid-connect/userinfo
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            {
              "sub": "user-123456",
              "name": "Alice Example",
              "given_name": "Alice",
              "family_name": "Example",
              "preferred_username": "alice",
              "email": "alice@example.com",
              "email_verified": true,
              "locale": "en",
              "updated_at": 1700000000,
              "realm_access": {
                "roles": ["offline_access", "uma_authorization", "default-roles-${realm}", "user"]
              }
            }

      # ── Token introspect — active token ──────────────────────────────────
      - id: introspect-active
        request:
          method: POST
          path: /realms/${realm}/protocol/openid-connect/token/introspect
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            {
              "active": true,
              "sub": "user-123456",
              "iss": "${issuer}/realms/${realm}",
              "aud": ["${client_id}", "account"],
              "exp": 9999999999,
              "iat": 1700000000,
              "jti": "mock-jti-001",
              "typ": "Bearer",
              "azp": "${client_id}",
              "preferred_username": "alice",
              "email": "alice@example.com",
              "email_verified": true,
              "scope": "openid email profile",
              "realm_access": {
                "roles": ["offline_access", "uma_authorization", "user"]
              }
            }

      # ── Logout ────────────────────────────────────────────────────────────
      - id: logout
        request:
          method: POST
          path: /realms/${realm}/protocol/openid-connect/logout
        response:
          status: 204
          headers: {}
          body: ""

      # ── Realm info ────────────────────────────────────────────────────────
      - id: realm-info
        request:
          method: GET
          path: /realms/${realm}
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            {
              "realm": "${realm}",
              "public_key": "",
              "token-service": "${issuer}/realms/${realm}/protocol/openid-connect",
              "account-service": "${issuer}/realms/${realm}/account",
              "tokens-not-before": 0
            }

      # ── Admin: list users ─────────────────────────────────────────────────
      - id: admin-list-users
        request:
          method: GET
          path: /admin/realms/${realm}/users
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            [
              {
                "id": "user-123456",
                "username": "alice",
                "enabled": true,
                "emailVerified": true,
                "firstName": "Alice",
                "lastName": "Example",
                "email": "alice@example.com",
                "createdTimestamp": 1700000000000,
                "requiredActions": [],
                "realmRoles": ["default-roles-${realm}", "user"]
              },
              {
                "id": "user-789012",
                "username": "bob",
                "enabled": true,
                "emailVerified": true,
                "firstName": "Bob",
                "lastName": "Example",
                "email": "bob@example.com",
                "createdTimestamp": 1700000001000,
                "requiredActions": [],
                "realmRoles": ["default-roles-${realm}"]
              }
            ]

      # ── Admin: get user ───────────────────────────────────────────────────
      - id: admin-get-user
        request:
          method: GET
          path: re:^/admin/realms/${realm}/users/[^/]+$
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            {
              "id": "user-123456",
              "username": "alice",
              "enabled": true,
              "emailVerified": true,
              "firstName": "Alice",
              "lastName": "Example",
              "email": "alice@example.com",
              "createdTimestamp": 1700000000000,
              "requiredActions": [],
              "realmRoles": ["default-roles-${realm}", "user"],
              "clientRoles": {}
            }

      # ── Admin: create user ────────────────────────────────────────────────
      - id: admin-create-user
        request:
          method: POST
          path: /admin/realms/${realm}/users
        response:
          status: 201
          headers:
            Location: ${issuer}/admin/realms/${realm}/users/user-new-001
          body: ""

      # ── Admin: delete user ────────────────────────────────────────────────
      - id: admin-delete-user
        request:
          method: DELETE
          path: re:^/admin/realms/${realm}/users/[^/]+$
        response:
          status: 204
          body: ""

      # ── Admin: get realm roles ────────────────────────────────────────────
      - id: admin-list-roles
        request:
          method: GET
          path: /admin/realms/${realm}/roles
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            [
              {"id": "role-001", "name": "user", "composite": false, "clientRole": false},
              {"id": "role-002", "name": "admin", "composite": false, "clientRole": false},
              {"id": "role-003", "name": "offline_access", "composite": false, "clientRole": false},
              {"id": "role-004", "name": "uma_authorization", "composite": false, "clientRole": false}
            ]

      # ── 401 for missing/invalid Authorization header ──────────────────────
      - id: userinfo-unauthorized
        request:
          method: GET
          path: /realms/${realm}/protocol/openid-connect/userinfo
          headers:
            Authorization: ""
        response:
          status: 401
          headers:
            WWW-Authenticate: 'Bearer realm="${realm}"'
            Content-Type: application/json
          body: |
            {
              "error": "HTTP 401 Unauthorized"
            }

# ── Scenarios ────────────────────────────────────────────────────────────────
# Activate via API: POST /api/scenarios/<id>/activate
# Deactivate via:  DELETE /api/scenarios/<id>/activate
# CLI:             mockly scenario activate keycloak-auth-down
scenarios:

  - id: keycloak-auth-down
    name: Auth Server Down
    description: Token, userinfo, and introspect endpoints all return 503. Use this to test your app's behaviour when Keycloak is unreachable.
    patches:
      - mock_id: token-success
        status: 503
        body: '{"error":"service_unavailable","error_description":"Authentication server is down"}'
      - mock_id: userinfo
        status: 503
        body: '{"error":"service_unavailable"}'
      - mock_id: introspect-active
        status: 503
        body: '{"error":"service_unavailable"}'

  - id: keycloak-unauthorized
    name: Token Invalid / Expired
    description: Token endpoint returns 401 and introspect reports the token as inactive. Simulates an expired or revoked token.
    patches:
      - mock_id: token-success
        status: 401
        body: '{"error":"unauthorized","error_description":"Invalid credentials"}'
      - mock_id: userinfo
        status: 401
        body: '{"error":"invalid_token","error_description":"Token is expired or invalid"}'
      - mock_id: introspect-active
        status: 200
        body: '{"active":false}'

  - id: keycloak-rate-limited
    name: Rate Limited
    description: Token and userinfo endpoints return 429. Test your app''s retry / back-off behaviour.
    patches:
      - mock_id: token-success
        status: 429
        headers:
          Retry-After: "10"
        body: '{"error":"too_many_requests","error_description":"Rate limit exceeded"}'
      - mock_id: userinfo
        status: 429
        headers:
          Retry-After: "10"
        body: '{"error":"too_many_requests"}'
      - mock_id: introspect-active
        status: 429
        body: '{"error":"too_many_requests"}'

  - id: keycloak-slow
    name: Slow Auth
    description: Adds a 3-second delay to the token and userinfo endpoints. Test your timeout handling.
    patches:
      - mock_id: token-success
        delay: 3s
      - mock_id: userinfo
        delay: 3s
      - mock_id: introspect-active
        delay: 3s
